name: Translation correction
description: Suggest a text fix or translation improvement
labels: [documentation, translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: English, Українська, Deutsch
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or key
      placeholder: README.md, /help/, a heading, or a label
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: false
